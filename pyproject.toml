[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-ledger"
version = "0.1.0"
description = "Offline source search, traceable excerpts and explicit review coverage"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
source-ledger = "source_ledger.__main__:main"
source-ledger-mcp = "source_ledger.mcp_server:main"

[tool.setuptools.packages.find]
include = ["source_ledger*"]
